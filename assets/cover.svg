    <text x="38" y="282" fill="#d8bcab">BUILDING TOOLS FOR REAL WORKFLOWS</text>
    <text x="920" y="282" text-anchor="end" fill="#ffbd8a">GITHUB.COM / CONELDIABLO</text>
  </g>
  <text x="34" y="180" fill="#fff0e1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="76" letter-spacing="-4">coneldiablo</text>
  <text x="39" y="218" fill="#e5c9b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19">From a conversation to a workflow.</text>
