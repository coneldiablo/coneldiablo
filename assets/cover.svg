<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">coneldiablo — Voice AI, CRM and automation</title>
  <desc id="desc">An amber voice waveform runs through a dark interface with a fine technical grid.</desc>
  <defs>
    <linearGradient id="surface" x2="100%" y2="100%">
      <stop stop-color="#191817"/>
      <stop offset="1" stop-color="#10100f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#b96b2b" stop-opacity=".26"/>
      <stop offset="1" stop-color="#b96b2b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse">
      <path d="M23 0H0V23" fill="none" stroke="#ffc38f" stroke-opacity=".12"/>
    </pattern>
    <linearGradient id="wave">
      <stop stop-color="#b95c31"/>
      <stop offset=".55" stop-color="#ffad70"/>
      <stop offset="1" stop-color="#ffdab0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="298" rx="17"/></clipPath>
    <clipPath id="plot"><rect x="607" y="85" width="314" height="143" rx="10"/></clipPath>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="17" fill="url(#surface)" stroke="#4f453c" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <ellipse cx="792" cy="149" rx="380" ry="230" fill="url(#halo)"/>
    <path d="M0 53H960M0 253H960" stroke="#4a3d32"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">
    <circle cx="42" cy="27" r="4" fill="#ffac70"/>
