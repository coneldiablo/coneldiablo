name: Refresh profile stats and snake

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-calendar

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render public profile cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_dashboard.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: coneldiablo
          outputs: |
            assets/snake.svg?color_snake=#536dfe&color_dots=#edf2fa,#c2d7ff,#88b3ff,#578bfa,#375ade
            assets/snake-dark.svg?color_snake=#b9a0ff&color_dots=#15213a,#25497a,#3b73bc,#619dff,#9ec5ff
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated artwork
        run: |
          git add assets/stats.svg assets/languages.svg assets/snake.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile stats and contribution snake'
          git push
